name: Noteto Reconciliation Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: development
      NOTETO_ENABLE_RECONCILIATION_REVIEW: "false"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3307"
      DB_NAME: "noteto_dev"
      DB_USER: "noteto_services"
      DB_PASSWORD: "ci_dummy_unused_password"
      SESSION_SECRET: "noteto-ci-fake-session-secret-for-testing-only"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify backend TypeScript
        run: npx --no-install tsc --project server/tsconfig.json --noEmit

      - name: Test reconciliation security
        run: npm run test:reconciliation-review